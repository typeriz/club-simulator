<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLUB SIMULATOR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Bebas+Neue&display=swap');

  :root {
    --black: #000000;
    --deep: #050508;
    --fog: #0a0a12;
    --neon-cyan: #00f5ff;
    --neon-pink: #ff0080;
    --neon-green: #39ff14;
    --neon-purple: #bf00ff;
    --text: #c8c8d4;
    --dim: #444455;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    overflow: hidden;
  }

  /* ── CANVAS ── */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ── SCANLINES ── */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.18) 2px,
      rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
  }

  /* ── VIGNETTE ── */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    background: radial-gradient(ellipse at center,
      transparent 40%,
      rgba(0,0,0,0.7) 100%);
    pointer-events: none;
  }

  /* ── MAIN LAYOUT ── */
  #app {
    position: relative;
    z-index: 10;
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: 1fr;
  }

  /* ── HEADER ── */
  header {
    padding: 28px 40px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(28px, 4vw, 52px);
    letter-spacing: 0.12em;
    color: #fff;
    text-shadow:
      0 0 20px var(--neon-cyan),
      0 0 60px rgba(0,245,255,0.3);
    line-height: 1;
  }

  .logo span {
    color: var(--neon-pink);
    text-shadow:
      0 0 20px var(--neon-pink),
      0 0 60px rgba(255,0,128,0.4);
  }

  .status-bar {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding-top: 6px;
  }

  .status-dot {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--neon-green);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--neon-green);
    box-shadow: 0 0 10px var(--neon-green);
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .bpm-counter {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.15em;
    font-style: italic;
  }

  /* ── CENTER STAGE ── */
  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 32px;
    padding: 20px 40px;
    position: relative;
  }

  /* ── VISUALIZER RING ── */
  .visualizer-shell {
    position: relative;
    width: min(380px, 60vw);
    height: min(380px, 60vw);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .visualizer-portrait {
    position: absolute;
    width: 49%;
    aspect-ratio: 1;
    border-radius: 50%;
    overflow: hidden;
    z-index: 1;
    background: #0a1018 url('30f66ba1-4118-4a21-a1af-bbb2bfbdb489.jpg') center 24% / cover no-repeat;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.08),
      0 0 40px rgba(0,0,0,0.45);
    opacity: 0.88;
  }

  .visualizer-portrait::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 38%, transparent 0 50%, rgba(0,0,0,0.16) 78%, rgba(0,0,0,0.34) 100%),
      linear-gradient(180deg, rgba(0,10,18,0.02) 0%, rgba(0,10,18,0.14) 100%);
    pointer-events: none;
  }

  .visualizer-portrait img { display: none; }

  #vis-canvas {
    width: min(380px, 60vw);
    height: min(380px, 60vw);
    position: relative;
    z-index: 5;
    filter: drop-shadow(0 0 30px rgba(0,245,255,0.4));
  }

  /* ── NOW PLAYING ── */
  .now-playing {
    text-align: center;
    position: relative;
  }

  .now-playing-label {
    font-size: 9px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 6px;
  }

  .track-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(18px, 3vw, 32px);
    letter-spacing: 0.08em;
    color: #fff;
    text-shadow: 0 0 30px rgba(255,255,255,0.5);
    animation: textflicker 8s infinite;
  }

  @keyframes textflicker {
    0%, 97%, 100% { opacity: 1; }
    98% { opacity: 0.6; }
    99% { opacity: 1; }
    99.5% { opacity: 0.3; }
  }

  /* ── PLAYER WRAPPER ── */
  .player-section {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .players-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .player-slot {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .player-slot-label {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--dim);
    padding-left: 2px;
  }

  .player-slot-label span { color: var(--neon-pink); }

  @media (max-width: 620px) {
    .players-grid { grid-template-columns: 1fr; }
  }

  .spotify-frame-wrapper {
    width: 100%;
    border: 1px solid rgba(0,245,255,0.15);
    box-shadow:
      0 0 0 1px rgba(0,245,255,0.05),
      0 0 40px rgba(0,245,255,0.1),
      0 0 80px rgba(255,0,128,0.05),
      inset 0 0 40px rgba(0,0,0,0.8);
    background: #000;
    position: relative;
    overflow: hidden;
    border-radius: 4px;
  }

  .spotify-frame-wrapper::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-pink), transparent);
    animation: scanbeam 4s linear infinite;
    z-index: 2;
  }

  .spotify-frame-wrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,245,255,0.03) 0%, transparent 30%);
    pointer-events: none;
    z-index: 2;
  }

  @keyframes scanbeam {
    0% { opacity: 0; transform: translateX(-100%); }
    50% { opacity: 1; }
    100% { opacity: 0; transform: translateX(100%); }
  }

  .spotify-frame-wrapper iframe {
    display: block;
    width: 100%;
    height: 152px;
    border: none;
    border-radius: 4px;
  }

  /* ── CONTROLS STRIP ── */
  .controls-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0 4px;
    gap: 10px;
    flex-wrap: wrap;
  }

  .ctrl-label {
    font-size: 10px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .mixer-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .crossfader {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 220px;
  }

  .crossfader-label {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    white-space: nowrap;
  }

  .crossfader input[type="range"] {
    width: 160px;
    accent-color: #ff0080;
    cursor: pointer;
  }

  .mixer-btn {
    border: 1px solid rgba(0,245,255,0.35);
    background: rgba(0,0,0,0.55);
    color: #d7f9ff;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .mixer-btn:hover {
    border-color: var(--neon-cyan);
    color: #fff;
    box-shadow: 0 0 16px rgba(0,245,255,0.25);
  }

  .mixer-btn.active {
    border-color: var(--neon-pink);
    color: #fff;
    box-shadow: 0 0 16px rgba(255,0,128,0.35);
  }

  .ctrl-lights {
    display: flex;
    gap: 10px;
  }

  .ctrl-light {
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: randpulse var(--dur, 2s) ease-in-out infinite;
    animation-delay: var(--del, 0s);
  }

  .ctrl-light:nth-child(1) { background: var(--neon-pink); box-shadow: 0 0 8px var(--neon-pink); --dur: 1.3s; --del: 0s; }
  .ctrl-light:nth-child(2) { background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); --dur: 2.1s; --del: 0.4s; }
  .ctrl-light:nth-child(3) { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); --dur: 1.7s; --del: 0.8s; }
  .ctrl-light:nth-child(4) { background: var(--neon-purple); box-shadow: 0 0 8px var(--neon-purple); --dur: 2.4s; --del: 0.2s; }

  @keyframes randpulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* ── FOOTER ── */
  footer {
    padding: 0 40px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .corner-text {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--dim);
    line-height: 1.8;
  }

  .corner-text a {
    color: rgba(0,245,255,0.5);
    text-decoration: none;
    transition: color 0.3s;
  }

  .corner-text a:hover { color: var(--neon-cyan); }

  /* ── STROBE OVERLAY ── */
  #strobe {
    position: fixed;
    inset: 0;
    z-index: 3;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.04s;
  }

  /* ── NOISE TEXTURE ── */
  .noise {
    position: fixed;
    inset: 0;
    z-index: 4;
    opacity: 0.025;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    animation: noiseshift 0.5s steps(1) infinite;
  }

  @keyframes noiseshift {
    0% { background-position: 0 0; }
    25% { background-position: 20px 40px; }
    50% { background-position: -30px 10px; }
    75% { background-position: 10px -20px; }
    100% { background-position: 0 0; }
  }

  /* ── LASER LINES ── */
  .laser-line {
    position: fixed;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    transform-origin: left center;
    animation: lasersweep var(--ld, 6s) ease-in-out infinite;
    animation-delay: var(--ldel, 0s);
  }

  @keyframes lasersweep {
    0%, 100% { opacity: 0; }
    10% { opacity: 0.6; }
    50% { opacity: 0.2; }
    90% { opacity: 0.5; }
  }

  /* ── FLICKER ── */
  body {
    animation: bodyflicker 12s infinite;
  }

  @keyframes bodyflicker {
    0%, 96%, 98%, 100% { filter: brightness(1); }
    97% { filter: brightness(0.85); }
    97.5% { filter: brightness(1.1); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px), (hover: none) and (pointer: coarse) {
    html, body {
      height: auto;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    #app {
      width: 100%;
      height: auto;
      min-height: 100vh;
      grid-template-rows: auto auto auto;
    }
    header { padding: 20px 20px 0; }
    footer { padding: 0 20px 20px; }
    .stage {
      padding: 12px 20px 24px;
      gap: 18px;
      justify-content: flex-start;
    }
    .spotify-frame-wrapper iframe { height: 160px; }
  }

  @media (max-width: 600px) {
    header {
      padding: 16px 14px 0;
      gap: 10px;
      align-items: flex-start;
    }
    .logo {
      font-size: clamp(24px, 9vw, 38px);
      letter-spacing: 0.08em;
    }
    .status-dot { font-size: 10px; letter-spacing: 0.14em; }
    .bpm-counter { font-size: 9px; }

    .stage {
      padding: 10px 14px 20px;
      gap: 12px;
    }
    .visualizer-shell {
      width: min(250px, 72vw);
      height: min(250px, 72vw);
    }
    #vis-canvas {
      width: min(250px, 72vw);
      height: min(250px, 72vw);
    }
    .track-title { font-size: clamp(17px, 6vw, 26px); }

    .player-section { gap: 8px; }
    .players-grid { gap: 10px; }
    .player-slot { gap: 6px; }
    .player-slot-label,
    .corner-text,
    .ctrl-label {
      font-size: 8px;
      letter-spacing: 0.2em;
    }
    .mixer-controls { gap: 6px; }
    .crossfader {
      min-width: 100%;
      justify-content: center;
    }
    .crossfader input[type="range"] { width: min(240px, 72vw); }
    .mixer-btn {
      font-size: 8px;
      letter-spacing: 0.12em;
      padding: 5px 8px;
    }
    .spotify-frame-wrapper iframe { height: 152px; }

    footer {
      padding: 0 14px 16px;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    footer .corner-text[style] { text-align: left !important; }
  }

  @media (max-width: 420px) {
    .stage { gap: 10px; }
    .visualizer-shell {
      width: min(220px, 74vw);
      height: min(220px, 74vw);
    }
    #vis-canvas {
      width: min(220px, 74vw);
      height: min(220px, 74vw);
    }
    .spotify-frame-wrapper iframe { height: 140px; }
  }

  @media (max-height: 650px) {
    .visualizer-shell { width: 200px; height: 200px; }
    #vis-canvas { width: 200px; height: 200px; }
    .stage { gap: 14px; }
    .spotify-frame-wrapper iframe { height: 150px; }
  }
</style>
</head>

<script>
// ── BACKGROUND CANVAS (particle/grid system) ──────────────────────────────
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], grid = [];
  const COLS = 28, ROWS = 18;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    buildGrid();
  }

  function buildGrid() {
    grid = [];
    const cw = W / COLS, ch = H / ROWS;
    for (let r = 0; r <= ROWS; r++) {
      for (let c = 0; c <= COLS; c++) {
        grid.push({ x: c * cw, y: r * ch, phase: Math.random() * Math.PI * 2 });
      }
    }
  }

  // Floating particles
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.5 + 0.3,
      vx: (Math.random() - 0.5) * 0.0003,
      vy: -(Math.random() * 0.0004 + 0.0001),
      color: Math.random() > 0.5 ? '#00f5ff' : Math.random() > 0.5 ? '#ff0080' : '#39ff14',
      opacity: Math.random() * 0.6 + 0.2,
      flicker: Math.random() * 0.02
    });
  }

  let t = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Deep background
    ctx.fillStyle = '#020205';
    ctx.fillRect(0, 0, W, H);

    // Subtle radial glow at center
    const grd = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W*0.55);
    grd.addColorStop(0, 'rgba(0,20,40,0.6)');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // Pink floor glow (bottom)
    const floorGrd = ctx.createLinearGradient(0, H*0.7, 0, H);
    floorGrd.addColorStop(0, 'transparent');
    floorGrd.addColorStop(1, 'rgba(255,0,128,0.04)');
    ctx.fillStyle = floorGrd;
    ctx.fillRect(0, 0, W, H);

    // Perspective grid
    ctx.save();
    const vanishX = W / 2;
    const vanishY = H * 0.45;
    const gridLines = 16;
    const spread = W * 0.7;

    ctx.strokeStyle = 'rgba(0,245,255,0.04)';
    ctx.lineWidth = 1;

    // Horizontal lines (converging to vanish point)
    for (let i = 0; i <= gridLines; i++) {
      const prog = i / gridLines;
      const y = vanishY + (H - vanishY) * prog;
      const xStart = vanishX - spread * 0.5 * prog;
      const xEnd = vanishX + spread * 0.5 * prog;
      const alpha = prog * 0.12;
      ctx.strokeStyle = `rgba(0,245,255,${alpha})`;
      ctx.beginPath();
      ctx.moveTo(xStart, y);
      ctx.lineTo(xEnd, y);
      ctx.stroke();
    }

    // Vertical lines (fan from vanish)
    const cols = 20;
    for (let i = 0; i <= cols; i++) {
      const prog = i / cols;
      const xBottom = (W * 0.1) + prog * (W * 0.8);
      ctx.strokeStyle = `rgba(0,245,255,0.04)`;
      ctx.beginPath();
      ctx.moveTo(vanishX, vanishY);
      ctx.lineTo(xBottom, H);
      ctx.stroke();
    }
    ctx.restore();

    // Particles
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.y < -0.02) p.y = 1.02;
      if (p.x < 0) p.x = 1;
      if (p.x > 1) p.x = 0;

      const flick = Math.sin(t * 0.05 + p.x * 10) * p.flicker;
      const op = Math.max(0, p.opacity + flick);

      ctx.save();
      ctx.globalAlpha = op;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    t++;
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

// ── VISUALIZER CANVAS ─────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('vis-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 400; canvas.height = 400;
  const cx = 200, cy = 200;

  const BARS = 80;
  let t = 0;
  let simBeat = 0;
  let beatTimer = 0;
  const BPM = 138;
  const beatInterval = (60 / BPM) * 60; // frames

  function easeOutExpo(x) { return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); }

  function draw() {
    ctx.clearRect(0, 0, 400, 400);

    beatTimer++;
    if (beatTimer >= beatInterval) {
      beatTimer = 0;
      simBeat = 1.0;
      // Occasional strobe
      if (Math.random() < 0.08) {
        const strobe = document.getElementById('strobe');
        strobe.style.opacity = '0.15';
        setTimeout(() => { strobe.style.opacity = '0'; }, 40);
      }
    }
    simBeat *= 0.92;

    // Outer ring glow
    const ringR = 145 + simBeat * 12;
    const ringGrd = ctx.createRadialGradient(cx, cy, ringR - 6, cx, cy, ringR + 6);
    ringGrd.addColorStop(0, 'rgba(0,245,255,0)');
    ringGrd.addColorStop(0.5, `rgba(0,245,255,${0.1 + simBeat * 0.3})`);
    ringGrd.addColorStop(1, 'rgba(0,245,255,0)');
    ctx.fillStyle = ringGrd;
    ctx.fillRect(0, 0, 400, 400);

    // Spectrum bars
    for (let i = 0; i < BARS; i++) {
      const angle = (i / BARS) * Math.PI * 2 - Math.PI / 2;
      const freq = i / BARS;

      // Simulate frequency data
      const bass = Math.max(0, Math.sin(t * 0.03 + simBeat * 3) * 0.5 + 0.5);
      const mid = Math.max(0, Math.sin(t * 0.05 + i * 0.3) * 0.4 + 0.3);
      const hi = Math.max(0, Math.sin(t * 0.08 + i * 0.5 + t * 0.02) * 0.3 + 0.2);

      let amp;
      if (freq < 0.2) amp = bass * (0.6 + simBeat * 0.8) + Math.random() * 0.1;
      else if (freq < 0.6) amp = mid * 0.5 + Math.random() * 0.15;
      else amp = hi * 0.3 + Math.random() * 0.08;

      amp = Math.max(0.05, amp);
      const len = 20 + amp * 55;
      const baseR = 100;

      const x1 = cx + Math.cos(angle) * baseR;
      const y1 = cy + Math.sin(angle) * baseR;
      const x2 = cx + Math.cos(angle) * (baseR + len);
      const y2 = cy + Math.sin(angle) * (baseR + len);

      // Color by frequency
      let color;
      if (freq < 0.25) color = `rgba(255,0,128,${0.6 + amp * 0.4})`;
      else if (freq < 0.55) color = `rgba(0,245,255,${0.5 + amp * 0.5})`;
      else color = `rgba(191,0,255,${0.4 + amp * 0.4})`;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.shadowColor = color;
      ctx.shadowBlur = 8 + amp * 12;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.restore();
    }

    // Inner circle
    ctx.save();
    ctx.strokeStyle = `rgba(0,245,255,${0.2 + simBeat * 0.5})`;
    ctx.lineWidth = 1;
    ctx.shadowColor = '#00f5ff';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(cx, cy, 100, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Rotating tick marks
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + t * 0.005;
      ctx.save();
      ctx.strokeStyle = `rgba(255,0,128,0.4)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 96, cy + Math.sin(a) * 96);
      ctx.lineTo(cx + Math.cos(a) * 104, cy + Math.sin(a) * 104);
      ctx.stroke();
      ctx.restore();
    }

    t++;
    requestAnimationFrame(draw);
  }

  draw();
})();

// ── TRACK TITLE CYCLING ───────────────────────────────────────────────────
(function() {
  const titles = [
    'INITIATING SEQUENCE...',
    'ENTER THE FLOOR',
    'DEEP FREQUENCY',
    'PHASE SHIFT ACTIVE',
    'SYSTEM ONLINE',
    'SUBSPACE TRANSMISSION',
    'GRID LOCKED',
    'CLUB SIMULATOR v∞',
  ];
  let idx = 0;
  const el = document.getElementById('track-title');

  function next() {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.4s';
    setTimeout(() => {
      idx = (idx + 1) % titles.length;
      el.textContent = titles[idx];
      el.style.opacity = '1';
    }, 420);
  }

  // Change every ~20s
  setInterval(next, 20000);
  // Initial reveal
  setTimeout(() => {
    el.textContent = titles[0];
    el.style.opacity = '1';
  }, 800);
})();

// ── DECK MIXER (SOLO A / SOLO B / DUAL) ───────────────────────────────────
(function() {
  const playerA = document.getElementById('spotify-player-a');
  const playerB = document.getElementById('spotify-player-b');
  const btnA = document.getElementById('mix-a');
  const btnB = document.getElementById('mix-b');
  const btnDual = document.getElementById('mix-dual');
  const status = document.getElementById('mix-status');
  const crossfader = document.getElementById('crossfader');

  const srcA = playerA.getAttribute('src');
  const srcB = playerB.getAttribute('src');

  function setActive(mode) {
    [btnA, btnB, btnDual].forEach(b => b.classList.remove('active'));

    if (mode === 'a') {
      btnA.classList.add('active');
      status.textContent = 'MIX::SOLO_A';
      if (playerA.getAttribute('src') !== srcA) playerA.setAttribute('src', srcA);
      playerB.setAttribute('src', 'about:blank');
    } else if (mode === 'b') {
      btnB.classList.add('active');
      status.textContent = 'MIX::SOLO_B';
      if (playerB.getAttribute('src') !== srcB) playerB.setAttribute('src', srcB);
      playerA.setAttribute('src', 'about:blank');
    } else {
      btnDual.classList.add('active');
      status.textContent = 'MIX::DUAL';
      if (playerA.getAttribute('src') !== srcA) playerA.setAttribute('src', srcA);
      if (playerB.getAttribute('src') !== srcB) playerB.setAttribute('src', srcB);
    }
  }

  function setFromCrossfader(value) {
    // Spotify embeds don't expose per-iframe volume control here,
    // so crossfader uses zone switching: left=solo A, center=dual, right=solo B.
    if (value <= 30) {
      setActive('a');
    } else if (value >= 70) {
      setActive('b');
    } else {
      setActive('dual');
    }
  }

  btnA.addEventListener('click', () => {
    crossfader.value = 0;
    setActive('a');
  });
  btnB.addEventListener('click', () => {
    crossfader.value = 100;
    setActive('b');
  });
  btnDual.addEventListener('click', () => {
    crossfader.value = 50;
    setActive('dual');
  });

  crossfader.addEventListener('input', () => {
    setFromCrossfader(Number(crossfader.value));
  });
})();

// ── BPM DISPLAY ───────────────────────────────────────────────────────────
(function() {
  const bpms = [128, 130, 132, 138, 140, 145, 150, 160, 174];
  let i = Math.floor(bpms.length / 2);
  const el = document.getElementById('bpm-display');
  setInterval(() => {
    i = (i + 1) % bpms.length;
    el.textContent = `♩ ${bpms[i]} BPM`;
  }, 30000);
})();
